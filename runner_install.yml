---
- name: Install Docker and GitLab Runner
  hosts: gitlab_server
  become: true
  gather_facts: true

  vars:
    gitlab_url: "http://192.168.0.188"
    runner_name: "unihelper-runner"
    runner_token: >-
      {{ lookup('ansible.builtin.env', 'GITLAB_RUNNER_TOKEN') }}

  tasks:
    - name: Check operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] == '12'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "This playbook expects Debian 12 amd64."

    - name: Check that runner token is supplied
      ansible.builtin.assert:
        that:
          - runner_token | length > 0
          - runner_token.startswith('glrt-')
        fail_msg: "Set GITLAB_RUNNER_TOKEN in Semaphore secret environment variables."
      no_log: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create APT key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: bookworm
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      async: 1800
      poll: 15

    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Download GitLab Runner repository script
      ansible.builtin.get_url:
        url: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh
        dest: /root/gitlab-runner-repository.sh
        mode: "0700"

    - name: Add GitLab Runner repository
      ansible.builtin.command:
        cmd: /bin/bash /root/gitlab-runner-repository.sh
        creates: /etc/apt/sources.list.d/runner_gitlab-runner.list

    - name: Install GitLab Runner
      ansible.builtin.apt:
        name: gitlab-runner
        state: present
        update_cache: true
      async: 1800
      poll: 15

    - name: Create Runner configuration directory
      ansible.builtin.file:
        path: /etc/gitlab-runner
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check whether this Runner is already configured
      ansible.builtin.command:
        argv:
          - grep
          - -Fq
          - 'name = "{{ runner_name }}"'
          - /etc/gitlab-runner/config.toml
      register: runner_exists
      changed_when: false
      failed_when: runner_exists.rc not in [0, 1, 2]

    - name: Register Docker executor with DinD support
      ansible.builtin.command:
        argv:
          - gitlab-runner
          - register
          - --non-interactive
          - --url
          - "{{ gitlab_url }}"
          - --token
          - "{{ runner_token }}"
          - --name
          - "{{ runner_name }}"
          - --executor
          - docker
          - --docker-image
          - docker:27-cli
          - --docker-privileged
          - --docker-volumes
          - /certs/client
          - --docker-volumes
          - /cache
      when: runner_exists.rc != 0
      no_log: true
      notify: Restart GitLab Runner

    - name: Limit Runner to one simultaneous job
      ansible.builtin.lineinfile:
        path: /etc/gitlab-runner/config.toml
        regexp: '^concurrent\s*='
        line: "concurrent = 1"
      notify: Restart GitLab Runner

    - name: Protect Runner configuration
      ansible.builtin.file:
        path: /etc/gitlab-runner/config.toml
        owner: root
        group: root
        mode: "0600"

    - name: Apply Runner changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure GitLab Runner is running
      ansible.builtin.systemd_service:
        name: gitlab-runner
        enabled: true
        state: started

    - name: Check Docker
      ansible.builtin.command: docker info
      changed_when: false

    - name: Check Compose
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Verify Runner registration
      ansible.builtin.command: gitlab-runner verify
      changed_when: false
      no_log: true

    - name: Show completion message
      ansible.builtin.debug:
        msg: "Docker and Runner are ready. Check Runner status in GitLab."

  handlers:
    - name: Restart GitLab Runner
      ansible.builtin.systemd_service:
        name: gitlab-runner
        state: restarted